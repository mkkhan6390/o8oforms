<!DOCTYPE html>
<html>
<head>
    <title>Personal Info Storage</title>
    <style>
        body {
            width: 400px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 10px;
            text-align: center;
            color: green;
            display: none;
        }
        #infoDisplay {
            margin-bottom: 15px;
        }
        .info-row {
            margin-bottom: 8px;
        }
        .info-label {
            font-weight: bold;
        }
        #personalInfoForm {
            display: none;
        }
        .default-data-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div id="infoDisplay"></div>
    <button id="editButton">Edit Information</button>

    <form id="personalInfoForm">
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" required>
        </div>
        <div class="form-group">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" required>
        </div>
        <div class="form-group">
            <label for="company">Company:</label>
            <input type="text" id="company">
        </div>
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title">
        </div>
        <div class="form-group">
            <label for="website">Website:</label>
            <input type="url" id="website">
        </div>
        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address">
        </div>
        <div class="form-group">
            <label for="city">City:</label>
            <input type="text" id="city">
        </div>
        <div class="form-group">
            <label for="state">State:</label>
            <input type="text" id="state">
        </div>
        <div class="form-group">
            <label for="zip">ZIP Code:</label>
            <input type="text" id="zip">
        </div>
        <div class="form-group">
            <label for="country">Country:</label>
            <input type="text" id="country">
        </div>
        <div class="form-group">
            <label for="subject">Subject:</label>
            <input type="text" id="subject">
        </div>
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="bestTimeToRespond">Best Time to Respond:</label>
            <input type="text" id="bestTimeToRespond">
        </div>
        <div class="default-data-section">
            <h3>Default Data for Unidentified Fields</h3>
            <div class="form-group">
                <label for="defaultData">Default Value:</label>
                <input type="text" id="defaultData">
            </div>
        </div>
        <button type="submit">Save Information</button>
        <button type="button" id="cancelButton">Cancel</button>
    </form>
    <div id="status" class="status">Information saved successfully!</div>
    <script src="popup.js"></script>
    <!-- Add this after the info display section -->
    <div class="analyze-section">
        <button id="analyzeButton">Analyze Form Fields</button>
        <div id="loader" class="loader" style="display: none;"></div>
    </div>
    <div id="analysisTable" style="display: none;"></div>
</body>
</html>
